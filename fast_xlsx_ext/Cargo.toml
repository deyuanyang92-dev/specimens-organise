[package]
name = "fast_xlsx_ext"
version = "0.1.0"
edition = "2021"

[lib]
name = "_fast_xlsx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rust_xlsxwriter = "0.88"
calamine = { version = "0.26", features = ["dates"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
