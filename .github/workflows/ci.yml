name: CI

# 2026-10-04：此前发布流程只打包 + 试启动，测试从未在 Windows 上跑过就发版。
# 现在：每次推送 / PR 都在 Windows 和 Linux 上跑全量测试；release.yml 先调用本文件，测试不过不打包、不发布。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # 单用例看门狗：卡住超过 180 s 打印全部线程调用栈并失败（见 scripts/run_tests.py）
        run: python -u scripts/run_tests.py --timeout 180
