name: Release

# 推送 v* 标签时，在 Windows 和 Linux 上各自构建发布包，
# 并把 zip + 对应的 .sha256 + (v0.10.8+) app-only zip + update_manifest.json 作为
# GitHub Release 资产上传。应用内"检查 GitHub 更新"会读取 manifest 判断是否走增量更新。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release
        # v0.10.8 fix: 强制 Python stdout/stderr UTF-8（Windows runner 默认 cp1252，
        # PyInstaller subprocess 打印 "标本入库管理_vX.Y.Z/..." 含 CJK 时 UnicodeEncodeError）
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python build_release.py --version ${{ steps.ver.outputs.version }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          # 安全：head_commit.message 是 untrusted 字符串，必须经 env 引用而非
          # 直接 inline 进 YAML 模板，防 workflow injection（不可信 commit message
          # 含 ` ${{...}} ` 即可执行任意脚本）。
          # 参考 https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        with:
          generate_release_notes: false
          body: |
            ## 本次更新

            ${{ env.HEAD_COMMIT_MESSAGE }}

            ---

            ## ⬇️ 下载安装（首次 / 全新安装）

            | 操作系统 | 下载文件 | 安装方式 |
            |---------|---------|--------|
            | **Windows 10/11 64位** | [`setup_v${{ steps.ver.outputs.version }}_windows.zip`](https://github.com/deyuanyang92-dev/specimens-organise/releases/download/v${{ steps.ver.outputs.version }}/setup_v${{ steps.ver.outputs.version }}_windows.zip) | 解压 → 双击 `.exe` 运行 |
            | **Linux (Ubuntu 20.04+)** | [`setup_v${{ steps.ver.outputs.version }}_linux.zip`](https://github.com/deyuanyang92-dev/specimens-organise/releases/download/v${{ steps.ver.outputs.version }}/setup_v${{ steps.ver.outputs.version }}_linux.zip) | 解压 → `chmod +x 文件名 && ./文件名` |

            ---

            ## ⚠️ 注意：不要手动下载 `app_v*.zip`

            下方文件列表中有两类 zip，**普通用户只下载 `setup_*`**：

            | 文件名 | 说明 | 能否直接运行 |
            |--------|------|------------|
            | `setup_v*_windows.zip` | **完整包**，含 Python 运行时 | ✅ 解压即可运行 |
            | `app_v*_windows.zip` | 仅 app 代码，**无** Python DLL | ❌ 手动解压运行会报错 `Failed to load Python DLL` |

            `app_v*.zip` 仅供软件内「检查更新」自动增量升级使用，不可手动解压运行。

            ---

            > `.sha256` 文件是完整性校验码，普通用户无需下载。
            > `update_manifest_*.json` 供应用内自动更新读取，无需手动处理。
          files: |
            releases/v${{ steps.ver.outputs.version }}/setup_*.zip
            releases/v${{ steps.ver.outputs.version }}/setup_*.zip.sha256
            releases/v${{ steps.ver.outputs.version }}/app_*.zip
            releases/v${{ steps.ver.outputs.version }}/app_*.zip.sha256
            releases/v${{ steps.ver.outputs.version }}/update_manifest_*.json
